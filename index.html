<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cricket Live - Shana</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SMZXC121E6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', '');
</script>
<style>
*{ -webkit-tap-highlight-color: transparent; }
html,body{
margin:0;
padding:0;
background:#000;
overflow:hidden;
width:100%;
height:100%;
font-family: monospace;
}

#main-iframe{
width:100%;
height:100%;
border:none;
display:block;
position:absolute;
top:0;
left:0;
transition: filter 0.3s ease;
z-index: 1;
}

.telegram-btn{
position:absolute;
top:15px;
left:15px;
z-index:9999;
display:flex;
align-items:center;
gap:12px;
background:linear-gradient(135deg,#1e88e5,#1565c0);
padding:10px 16px;
border-radius:14px;
text-decoration:none;
color:#fff;
font-size:16px;
font-weight: normal;
font-family: monospace;
box-shadow:0 6px 18px rgba(0,0,0,0.5);
cursor: pointer;
}

.telegram-icon{
width:34px;
height:34px;
display:flex;
align-items:center;
justify-content:center;
flex-shrink: 0;
}

.telegram-icon img{
width:100%;
height:100%;
object-fit:contain;
display:block;
}

.error-msg{
color:white;
text-align:center;
font-family: monospace;
font-weight: normal;
font-size: 18px;
margin-top:20px;
position:absolute;
width:100%;
top:50%;
transform:translateY(-50%);
z-index: 10;
}

/* Loading Stream */
#loader{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:2;
text-align:center;
color:#a0a0a0;
font-family: monospace;
font-weight: normal;
display:flex;
flex-direction:column;
align-items:center;
gap:12px;
pointer-events:none;
}

.dish-icon{
width:50px;
height:50px;
fill:#28a8ea;
animation: pulse 1.5s infinite ease-in-out;
}

@keyframes pulse{
0%, 100%{ transform: scale(1); opacity: 0.8; }
50%{ transform: scale(1.1); opacity: 1; }
}

/* Blur effect when popup is active */
.blur-bg{
filter: blur(10px);
-webkit-filter: blur(10px);
}
</style>
</head>

<body>

<div id="telegram-trigger" class="telegram-btn">
<div class="telegram-icon">
  <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffffff'><path d='M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-2.02 9.51c-.15.68-.56.84-1.13.53l-3.11-2.29-1.5 1.45c-.17.17-.31.31-.63.31l.22-3.17 5.78-5.22c.25-.22-.05-.34-.39-.12l-7.14 4.5-3.08-.96c-.67-.21-.68-.67.14-.99l12.04-4.64c.56-.2 1.05.14.82 1.1z'/></svg>" alt="Telegram">
</div>
<span>Join Shana - Cookin'</span>
</div>

<div id="loader">
  <svg class="dish-icon" viewBox="0 0 24 24">
    <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L3.5 20.5a1 1 0 0 0 1.41 1.41l2.89-1.47A8.94 8.94 0 0 0 12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7z"/>
  </svg>
  <span>Loading Stream...</span>
</div>

<iframe id="main-iframe" allowfullscreen allow="encrypted-media; fullscreen; autoplay"></iframe>

<script>
window.addEventListener('DOMContentLoaded',()=>{

const iframe=document.getElementById('main-iframe');
const loader=document.getElementById('loader');
const telegramTrigger=document.getElementById('telegram-trigger');

function triggerPopup(){
  iframe.classList.add('blur-bg');
  setTimeout(()=>{
    const join = confirm("Join Telegram Channel");
    if(join){
      location.href = "https://t.me/+U_REj979FENlMTM9";
    }
    iframe.classList.remove('blur-bg');
  }, 100);
}

// Initial popup load
triggerPopup();

// Bind popup to telegram banner click
if(telegramTrigger){
  telegramTrigger.addEventListener('click', (e)=>{
    e.preventDefault();
    triggerPopup();
  });
}

const urlParams=new URLSearchParams(window.location.search);
const play=urlParams.get('play');

if(play){
fetch('https://shanakajson.pages.dev/id.json')
.then(res=>res.json())
.then(data=>{
const targetData=data.iframes.find(item=>item.id===play);
if(targetData && targetData.iframeSrc){
iframe.src=targetData.iframeSrc;

iframe.onload = () => { if(loader) loader.style.display = 'none'; };
setTimeout(() => { if(loader) loader.style.display = 'none'; }, 3000);

if(targetData.hit){
fetch(targetData.hit).catch(()=>{});
}

}else{
showError("Stream Not Found");
}
})
.catch(()=>{
showError("Error Loading Data");
});
}else{
showError("No Stream Available");
}

function showError(msg){
if(loader) loader.style.display = 'none';
const h2=document.createElement('h2');
h2.className='error-msg';
h2.innerText=msg;
document.body.appendChild(h2);
iframe.style.display='none';
const badge=document.querySelector('.telegram-btn');
if(badge) badge.style.display='none';
}

});
</script>
</body>
</html>
